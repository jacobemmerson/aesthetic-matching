services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000", "100.103.5.49:8000:8000"]   # nginx + tailnet only
    volumes:
      - "./data:/app/data:ro"   # index.npz + graph.json + encoder.onnx + the face-detector ONNX; images are not needed at runtime
    environment: ["LLM_URL=http://host.docker.internal:8081"]   # llama-server runs on the host; see deploy/llama-server.service
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
